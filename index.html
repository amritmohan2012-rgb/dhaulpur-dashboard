<title>Dhaulpur Leadership Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--amber:#f7b133;--peach:#fce5cd;--cream:#fefaf7;--tx:#434343;--tx2:#666666;--tx3:#8c8c8c;--line:#eadfd2;--bg:#ffffff;--red:#d9604c;--blue:#4a90b8;--green:#5a9e6f;
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;font-style:normal!important}
html{color-scheme:light;scroll-padding-top:calc(var(--sat) + 120px)}
html,body{margin:0;background:#fff}
body{font-family:'Roboto',Arial,Helvetica,sans-serif;color:var(--tx);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:3px solid var(--amber)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.hd h1{margin:0;font-size:22px;font-weight:700;color:var(--tx);letter-spacing:.2px}
.hd .sub{color:var(--tx2);font-size:13px;margin-top:2px}
.logo{height:40px;width:auto;flex:none}
.asof{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 0 10px;color:var(--tx3);font-size:12px}
.asof b{color:var(--tx2);font-weight:500}
nav{position:sticky;top:var(--sat);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:0;background:none;font:500 14px 'Roboto',Arial,sans-serif;color:var(--tx2);padding:13px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button.on{color:var(--tx);border-bottom-color:var(--amber);font-weight:700}
main{padding:16px 0 48px}
.tab{display:none}.tab.on{display:block}
.filters{background:var(--cream);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.filters summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--tx);display:none}
.filters summary::-webkit-details-marker{display:none}
.fgrid{display:flex;flex-wrap:wrap;gap:10px 16px;padding:12px 14px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:140px}
.f label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
select,input[type=date],input[type=search]{font:400 14px 'Roboto',Arial,sans-serif;color:var(--tx);border:1px solid #d9cfc3;background:#fff;border-radius:8px;padding:8px 10px;min-height:38px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;border-top:3px solid var(--amber)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3)}
.kpi .v{font-size:24px;font-weight:700;color:var(--tx);margin-top:2px}
.kpi .s{font-size:12px;color:var(--tx2);margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-bottom:14px;min-width:0}
.card h3{margin:0 0 2px;font-size:16px;font-weight:700}
.card .note{color:var(--tx3);font-size:12px;margin:0 0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--cream);color:var(--tx2);font-weight:500;text-align:right;padding:8px 10px;border-bottom:2px solid var(--peach);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid #f1ebe3;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.tot td{font-weight:700;background:var(--cream);border-top:2px solid var(--peach)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--peach);color:var(--tx)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:6px 10px;align-items:center;font-size:13px}
.hb .nm{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hb .bar{height:18px;border-radius:4px;min-width:2px}
.hb .vl{font-weight:500;color:var(--tx);white-space:nowrap;font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tx2);margin:6px 0 8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--cream);overflow:hidden;touch-action:none}
.mapbox svg{display:block;width:100%;height:auto;max-height:70vh;cursor:grab}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid #d9cfc3;background:#fff;border-radius:8px;font:500 18px 'Roboto',Arial;cursor:pointer;color:var(--tx)}
.info{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;min-height:44px;color:var(--tx2)}
.info b{color:var(--tx)}
.cal td,.cal th{padding:0;text-align:center}
.cal th{font-size:10px;padding:4px 0;font-weight:500}
.cal td.nm{position:sticky;left:0;background:#fff;text-align:left;padding:6px 10px 6px 4px;font-size:12.5px;white-space:nowrap;z-index:2;border-right:1px solid var(--line)}
.cal th.nm{position:sticky;left:0;z-index:3}
.cell{display:block;width:24px;height:24px;margin:2px auto;border-radius:5px;font-size:10px;line-height:24px;color:var(--tx);cursor:pointer}
.c-p{background:var(--amber)}.c-a{background:#f4c3bb;color:#8a2f20}.c-h{background:#ececec;color:#aaa}.c-ws{background:var(--amber);box-shadow:inset 0 0 0 2px var(--tx)}.c-n{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#eee 3px,#eee 6px);color:#aaa;border:1px solid #e5e5e5}
.cell.sel{outline:2px solid var(--tx);outline-offset:1px}
.tl{margin:0;padding:0;list-style:none;font-size:13px}
.tl li{padding:7px 0 7px 14px;border-left:3px solid var(--peach);margin-left:6px;position:relative}
.tl li b{color:var(--tx)}
.tl li:before{content:'';position:absolute;left:-7px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--amber);border:2px solid #fff}
.tl li.s:before{background:var(--green)}.tl li.e:before{background:var(--tx)}
.more{margin-top:10px;border:1px solid #d9cfc3;background:#fff;border-radius:8px;padding:8px 14px;font:500 13px 'Roboto',Arial;cursor:pointer;color:var(--tx)}
.warn{background:var(--cream);border-left:4px solid var(--amber);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--tx2);margin-bottom:14px}
.warn b{color:var(--tx)}
.dpl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--cream);border-radius:8px;padding:6px 10px;font-size:12.5px}
.chip b{color:var(--tx)}
footer{color:var(--tx3);font-size:12px;padding:10px 0 30px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.hd h1{font-size:18px}.logo{height:30px}.wrap{padding:0 12px}.kpi .v{font-size:21px}
 .filters summary{display:block}.filters:not([open]) .fgrid{display:none}.f{min-width:46%;flex:1}
 .rs thead{display:none}.rs,.rs tbody,.rs tr,.rs td{display:block;width:100%}
 .rs tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 10px;background:#fff}
 .rs td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right;white-space:normal}
 .rs td:before{content:attr(data-l);color:var(--tx3);font-size:12px;text-align:left}
 .rs td:first-child{font-weight:700;border-bottom:1px solid var(--peach);padding-bottom:5px;margin-bottom:3px}
 .rs td:first-child:before{content:''}
 .rs td:first-child{justify-content:flex-start;text-align:left;gap:8px;align-items:center}
 .rs tr.tot{background:var(--cream)}
 .hb{grid-template-columns:minmax(80px,110px) 1fr}}

.ctag{display:inline-block;min-width:26px;text-align:center;padding:1px 7px;border-radius:99px;font-size:11.5px;font-weight:700;color:#fff;line-height:1.5}
.ctag.A{background:#5a9e6f}.ctag.B{background:#f7b133;color:#434343}.ctag.C1{background:#4a90b8}.ctag.C2{background:#d9604c}.ctag.NC{background:#e3e3e3;color:#666;font-weight:500}
.rl{margin:3px 0 0;font-size:12px;color:var(--tx2);line-height:1.9}
.rl span.r{display:inline-block;margin-right:10px;white-space:nowrap}

.stabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:10px 0 14px}
.stabs button{flex:none;border:0;background:none;font:500 14px 'Roboto',Arial,sans-serif;color:var(--tx2);padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stabs button.on{color:var(--tx);border-bottom-color:var(--amber);font-weight:700}

tr.click{cursor:pointer}tr.click:hover td{background:#fff7ea}tr.selrow td{background:var(--peach)!important;font-weight:500}
.hint{color:var(--tx3);font-size:12px;margin:8px 0 0}

.tgl{display:flex;gap:0;margin:0 0 12px;border:1px solid #d9cfc3;border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.tgl button{border:0;background:#fff;font:500 13px 'Roboto',Arial,sans-serif;color:var(--tx2);padding:9px 14px;cursor:pointer}
.tgl button.on{background:var(--amber);color:var(--tx);font-weight:700}
.tgrow{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--cream)}
.tgn{font-size:16px;font-weight:700;color:var(--tx)}
.tgs{font-size:13px;color:var(--tx2);margin-top:4px}
.tgp{font-size:15px;color:var(--tx);margin:6px 0 2px}
.tgp b{font-size:22px}
.pbar{height:12px;border-radius:99px;background:var(--peach);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--amber);border-radius:99px;min-width:3px}
tr.exp>td{padding:0!important;white-space:normal!important;text-align:left!important;background:#fff!important;border-bottom:2px solid var(--peach)}
.expbox{padding:12px 10px 14px;background:var(--cream)}
.exph{font-size:13px;color:var(--tx2);margin-bottom:8px}
.expbox .scroll{background:#fff}
@media(max-width:820px){.rs tr.exp{border:0;padding:0;background:none;margin-bottom:10px}
 .rs tr.exp td,.rs tr.exp td:first-child{display:block;font-weight:400;border:0;padding:0;margin:0}
 .rs tr.exp td:before{content:none}
 .tgl{width:100%}.tgl button{flex:1}}
.qdb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.qb{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:13.5px;cursor:pointer;color:#434343}.qb.on{background:#F7B133;border-color:#F7B133;font-weight:500}</style>

 h+=card('MAT-wise plan and progress','One row per MAT. Category columns count RWEs and SS mapped in all villages of the MAT.',catLegend()+hbars(mr.filter(r=>r.slots>0).map(r=>({l:r.m.name,v:r.slots,c:mcol(r.m.id),t:r.slots+' visits in '+r.pv+' villages'+(HASATT?', '+r.vi+' of '+r.du+' due visited':'')})))+'<div style="height:12px"></div>'+tbl([{h:'MAT',k:r=>esc(r.m.name)},{h:'Villages',k:r=>r.v},{h:'Villages with a date',k:r=>r.pv},{h:'Visits planned',k:r=>r.slots},{h:'Plan days',k:r=>r.days},{h:'First date',k:r=>dmy(r.from)},{h:'Last date',k:r=>dmy(r.to)},{h:'Due to 26 Oct',k:r=>r.du},{h:'Visited',k:r=>HASATT?r.vi:'-'},{h:'Visited %',k:r=>HASATT?pct(r.vi,r.du):'-'},{h:'RWE / SS mapped',k:r=>num(mixN(r.mix))},...CALL.map(c=>({h:c==='NC'?'Not categorised':'Category '+c,k:r=>num(r.mix[c])})),{h:'Est. road km',k:r=>Math.round(r.km)}],mr));
 const dl=uniq(sched.map(r=>r.d)).sort();
 h+=card('Village visits planned per day','Across the selected MATs, blocks and dates',vbars(dl.map(d=>d.slice(8)),[{c:'#f7b133',vals:dl.map(d=>sched.filter(r=>r.d===d).length)}],{fmt:num,sub:dl.map(d=>DOWN[dow(d)][0])}));
 h+=card('Route map','Numbers show the first plan day of the month. Fill colour = MAT (grey = no MAT yet, no date). Ring = status of the first visit: grey due, white upcoming'+(HASATT?', green visited, blue visited other day, red not visited':'')+'. Solid lines join villages planned on the same day. Tap a dot for details.',legend(ml.map(m=>[m.name,mcol(m.id)]))+'<div id="r-map"></div>');
 const byM=ml.map(m=>({m,s:sched.filter(r=>r.mid===m.id)})).filter(x=>x.s.length);
 const vd=v=>(VDATES[v.mid+'|'+v.vc]||[]).filter(d=>d!==v.d).sort();const vlab=v=>esc(v.vn)+(v.n>1?' (2nd visit)':'')+(v.s==='Upcoming'||v.s==='Due'?'':' ('+v.s.toLowerCase()+')')+(v.s!=='Visited'&&vd(v).length?' <b style="color:#2f7a4a">[visited on '+vd(v).map(dmy).join(', ')+']</b>':'');

 root.innerHTML=h;
 const pts=[],lines=[];
 uv(rows.slice().sort((a,b)=>(a.d||'9').localeCompare(b.d||'9'))).forEach(r=>{const sl=rows.filter(x=>x.vc===r.vc&&x.d);const ds=sl.map(x=>dmy(x.d)).join(' and ');pts.push({lat:r.lat,lng:r.lng,r:r.d?8:5,c:mcol(r.mid),ring:SCOL[r.s]||'#fff',txt:r.d?String(+r.d.slice(8)):null,info:`<b>${esc(r.vn)}</b> (${esc(r.blk)})<br>${esc(mname(r.mid))} | ${r.d?ds:'no visit date yet'}<br>${mixN(vcat(r.vc))} RWE / SS mapped<br>Category: ${catMix(vcat(r.vc))}`})});
 byM.forEach(x=>uniq(x.s.map(r=>r.d)).forEach(d=>{const l=x.s.filter(r=>r.d===d&&r.lat!=null);if(l.length>1)lines.push({pts:l.map(r=>[r.lat,r.lng]),c:mcol(x.m.id)})}));
 drawMap($('#r-map'),pts,lines);
 [['r-blk','blk'],['r-mat','mat']].forEach(([id,k])=>$('#'+id).onchange=e=>{st[k]=e.target.value;st.ulim=40;render()});
 dateH('r',st,render);
 const mo=$('#r-more');if(mo)mo.onclick=()=>keepY(()=>{st.ulim+=80;render()});
}
window.renderRte=render;render();
})();
